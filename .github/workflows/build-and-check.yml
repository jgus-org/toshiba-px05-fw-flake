# The gate a pull request has to pass: `nix run github:jgus-org/flake-lib/v1#build-and-check`,
# which builds every package this flake publishes for the runner's system and then runs
# `nix flake check`. The check alone is not the gate -- it looks at the shape of `packages`
# without building them -- and the updater's build is not either, running on the publication path
# after the merge. A package the runner cannot build sets `passthru.ciBuildSkip = true` with the
# reason beside it, and the run names every package it skipped.
#
# Nothing here is producer-specific, so `nix run
# github:jgus-org/flake-lib/v1#update-workflows` replaces this file wholesale; a repository
# that does not have it installs it with `-- adopt build-and-check.yml`. Edit it in
# jgus-org/flake-lib's templates/workflows. Binary caching uses the fleet Attic cache
# whenever ATTIC_TOKEN resolves -- an organization secret covers every repository at once --
# and a repository or fork pull request with no token runs on the public cache alone. Nix
# fetches a github input anonymously, so a flake that locks a private repository needs
# BUILD_TOKEN, and a repository without it runs on the public inputs it can fetch.
#
# A gate runs on a hosted runner unless the repository sets the `RUNNER` variable to a
# label one of its own runners carries.

name: Build and Check

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-and-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      # The gate is one published command so this path and the publication path run one
      # definition. Both of its halves run even when the first fails: a tree with two problems
      # and a gate that stops at the first reports one.
      - name: Run the gate
        run: nix run github:jgus-org/flake-lib/v1#build-and-check

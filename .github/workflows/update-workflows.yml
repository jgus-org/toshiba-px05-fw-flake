# The only workflow that writes a templated workflow file; edit it in jgus-org/flake-lib's
# templates/workflows, not here. Its schedule runs ahead of the update workflows' 07:00 so the
# day's templates are committed before an update run reads its workflow file, and a workflow is
# read when its run starts, so a refresh lands on the run after the one that wrote it.
#
# Nothing waits for an update run's commit and nothing waits for this one. Both push the same
# branch expecting the SHA they read, so whichever lands second reports the concurrent change
# instead of overwriting it -- a run lost, not a state lost. A run that cannot be cancelled is
# the reason: a group that held both would be held forever by it, freezing every later update in
# the repository, including the refresh that would carry the fix.
#
# Pushing a workflow file needs a credential that may write workflows. A run's own token cannot
# unless the workflow grants `workflows: write`, so without ORG_UPDATE_TOKEN this run advances
# its input and fails to commit it. Advancing the input reads the whole input graph, so a flake
# that locks a private repository needs BUILD_TOKEN, which the nix action hands over.

name: Update workflows

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  workflows:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.ORG_UPDATE_TOKEN || github.token }}

      - uses: jgus-org/flake-lib/.github/actions/nix@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          github-token: ${{ secrets.BUILD_TOKEN }}

      - name: Update workflows from flake-lib templates
        run: nix run github:jgus-org/flake-lib/v1#update-workflows
